<!DOCTYPE html>
<html>
<head>
<title>Trip Planning Registration</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
    url("https://images.unsplash.com/photo-1469854523086-cc02fe5d8800") no-repeat center center/cover;
}

.container {
    background: white;
    padding: 40px;
    width: 420px;
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

h1 {
    text-align: center;
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    color: #023047;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    font-size: 14px;
    color: #555;
    margin-bottom: 25px;
}

label {
    font-weight: 500;
    font-size: 14px;
    color: #333;
}

input, select {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    margin-bottom: 8px;
    border-radius: 6px;
    border: 2px solid #ccc;
    outline: none;
    font-size: 14px;
}

input.error, select.error {
    border-color: red;
}

input.success, select.success {
    border-color: green;
}

small {
    color: red;
    font-size: 12px;
    display: block;
    margin-bottom: 12px;
}

/* Proper checkbox alignment */
.password-options {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
    margin-bottom: 15px;
    font-size: 13px;
    color: #333;
}

.password-options input {
    width: auto;
}

button {
    width: 100%;
    padding: 12px;
    background: #0077b6;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
}

button:hover {
    background: #023e8a;
}

</style>
</head>

<body>

<div class="container">

<h1>Trip Planning</h1>
<div class="subtitle">Plan Your Perfect Journey</div>

<form id="form" novalidate>

<label>Full Name</label>
<input type="text" id="name" placeholder="Enter your full name">
<small></small>

<label>Email</label>
<input type="text" id="email" placeholder="example@gmail.com">
<small></small>

<label>Phone Number</label>
<input type="text" id="phone" maxlength="10" placeholder="10 digit number">
<small></small>

<label>Destination Type</label>
<select id="destination">
<option value="">Select Option</option>
<option>Domestic</option>
<option>International</option>
</select>
<small></small>

<label>Password</label>
<input type="password" id="password" placeholder="Strong password">
<small></small>

<div class="password-options">
<input type="checkbox" onclick="togglePassword()"> 
<label style="margin:0;">Show Password</label>
</div>

<button type="submit">Register</button>

</form>
</div>

<script>

let form = document.getElementById("form");
let nameInput = document.getElementById("name");
let emailInput = document.getElementById("email");
let phoneInput = document.getElementById("phone");
let passwordInput = document.getElementById("password");
let destinationInput = document.getElementById("destination");

// Toggle password
function togglePassword() {
    passwordInput.type = passwordInput.type === "password" ? "text" : "password";
}

// Block numbers in name
nameInput.addEventListener("keypress", function(e) {
    let char = String.fromCharCode(e.which);
    if(!/[A-Za-z\s]/.test(char)) {
        e.preventDefault();
    }
});

// Only numbers in phone
phoneInput.addEventListener("input", function() {
    phoneInput.value = phoneInput.value.replace(/[^0-9]/g, "");
});

// Validation
function validate() {

    let valid = true;

    if(nameInput.value.trim() === "") {
        showError(nameInput, "Name cannot be empty");
        valid = false;
    } else showSuccess(nameInput);

    let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if(!emailPattern.test(emailInput.value)) {
        showError(emailInput, "Enter valid email");
        valid = false;
    } else showSuccess(emailInput);

    if(phoneInput.value.length !== 10) {
        showError(phoneInput, "Phone must be exactly 10 digits");
        valid = false;
    } else showSuccess(phoneInput);

    if(destinationInput.value === "") {
        showError(destinationInput, "Please select destination type");
        valid = false;
    } else showSuccess(destinationInput);

    let passwordPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;
    if(!passwordPattern.test(passwordInput.value)) {
        showError(passwordInput,
        "Password must contain uppercase, lowercase, number & special character (min 8 chars)");
        valid = false;
    } else showSuccess(passwordInput);

    return valid;
}

function showError(input, message) {
    input.classList.add("error");
    input.classList.remove("success");
    input.nextElementSibling.innerText = message;
}

function showSuccess(input) {
    input.classList.remove("error");
    input.classList.add("success");
    input.nextElementSibling.innerText = "";
}

form.addEventListener("submit", function(e) {
    if(!validate()) {
        e.preventDefault();
        alert("Please correct all fields!");
    } else {
        alert("Registration Successful!");
    }
});

</script>

</body>
</html>
